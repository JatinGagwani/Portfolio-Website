<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | Jatin Gagwani</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | truncate: 160 }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Sora', sans-serif; background: #fff; color: #323232; overflow-x: hidden; }
    a { text-decoration: none; }

    /* ─── HEADER ─── */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 14px 20px;
      transition: transform 0.32s ease;
    }
    #site-header.header-hidden { transform: translateY(-110%); }
    .header-pill {
      background: rgba(246,246,246,0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 100px;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo-text {
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #111;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .header-nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .header-nav a {
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      color: #333;
      padding: 8px 18px;
      border-radius: 50px;
      transition: background 0.2s, color 0.2s;
    }
    .header-nav a:hover { background: rgba(0,0,0,0.06); color: #111; }

    /* ─── ARTICLE ─── */
    .post-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 130px 40px 100px;
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .post-back {
      font-size: 13px;
      color: #999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .post-back:hover { color: #111; }
    .post-date {
      font-size: 13px;
      color: #bbb;
    }
    .post-title {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 800;
      color: #111;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 48px;
    }
    .post-body { font-size: 17px; line-height: 1.8; color: #333; }
    .post-body h2 { font-size: 24px; font-weight: 700; color: #111; margin: 48px 0 16px; }
    .post-body h3 { font-size: 20px; font-weight: 700; color: #111; margin: 36px 0 12px; }
    .post-body p { margin-bottom: 24px; }
    .post-body ul, .post-body ol { padding-left: 24px; margin-bottom: 24px; }
    .post-body li { margin-bottom: 8px; }
    .post-body a { color: #111; text-decoration: underline; text-underline-offset: 3px; }
    .post-body a:hover { color: #555; }
    .post-body strong { font-weight: 700; color: #111; }
    .post-body blockquote {
      border-left: 3px solid #111;
      padding-left: 20px;
      margin: 32px 0;
      color: #555;
      font-style: italic;
    }
    .post-body hr { border: none; border-top: 1px solid #eee; margin: 48px 0; }
    .post-body img { max-width: 100%; border-radius: 8px; margin: 16px 0; }
    .post-body code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    .post-body pre {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 24px;
    }
    .post-body pre code { background: none; padding: 0; }

    /* ─── FOOTER ─── */
    .site-footer {
      background: #000;
      color: #fff;
      padding: 60px 57px 40px;
      border-top: 1px solid #1a1a1a;
    }
    .footer-top { margin-bottom: 80px; }
    .footer-logo { width: clamp(260px, 35vw, 480px); height: auto; display: block; }
    .footer-bottom {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr auto;
      align-items: center;
    }
    .footer-nav { display: flex; gap: 32px; }
    .footer-nav a {
      font-family: 'Sora', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #979797;
      letter-spacing: 1px;
      transition: color 0.2s;
    }
    .footer-nav a:hover { color: #fff; }
    .footer-social { display: flex; gap: 36px; justify-content: center; }
    .footer-social a { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
    .footer-social img { width: 100%; height: 100%; object-fit: contain; }
    .footer-email { display: flex; justify-content: flex-end; }
    .footer-email a {
      font-family: 'Sora', sans-serif;
      font-size: clamp(18px, 2vw, 27px);
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .footer-email a:hover { color: #979797; }
    .footer-divider { border: none; border-top: 1px solid #333; margin: 32px 0 16px; }
    .footer-copyright { text-align: center; font-family: 'Sora', sans-serif; font-size: 12px; color: #fff; }

    @media (max-width: 768px) {
      .post-wrap { padding: 110px 24px 80px; }
      .site-footer { padding: 48px 28px 32px; }
      .footer-bottom { grid-template-columns: 1fr; gap: 32px; text-align: center; }
      .footer-nav { justify-content: center; }
      .footer-social { justify-content: center; }
      .footer-email { justify-content: center; }
      .footer-logo { width: clamp(200px, 60vw, 320px); }
    }
  </style>
</head>

  <!-- ─── POST ─── -->

      <div class="post-meta">
        <a href="/blog" class="post-back">← All Posts</a>
        <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-body">
        {{ content }}
      </div>
    </div>
  </main>

  <script>
    const header = document.getElementById('site-header');
    let lastScrollY = window.scrollY;
    window.addEventListener('scroll', () => {
      const currentY = window.scrollY;
      if (currentY <= 40) header.classList.remove('header-hidden');
      else if (currentY < lastScrollY) header.classList.remove('header-hidden');
      else if (currentY > lastScrollY + 4) header.classList.add('header-hidden');
      lastScrollY = currentY;
    }, { passive: true });
  </script>
